<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photography — Linnea RM</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#e7e7e7;color:#0757e8}.header{padding:20px 3vw;display:flex;justify-content:space-between;align-items:center}.header a{color:#0757e8;text-decoration:none;font:28px Impact,sans-serif}.categories{display:flex;flex-wrap:wrap;gap:12px 22px;margin:30px 3vw 60px}.categories a{color:#0757e8;text-decoration:none;font:19px Impact,sans-serif}.categories a.active{text-decoration:underline;text-underline-offset:6px}h1{font:clamp(70px,13vw,210px)/.9 Impact,sans-serif;margin:60px 3vw 20px;text-transform:uppercase;overflow-wrap:anywhere}.sub{margin:0 3vw 20px;font:16px Impact,sans-serif;letter-spacing:2px}.gallery{margin:30px 3vw 100px;columns:3 260px;column-gap:18px}.tile{display:block;break-inside:avoid;margin-bottom:18px;border:0;background:none;padding:0;width:100%;cursor:zoom-in}.tile img{display:block;width:100%;height:auto;transition:opacity .2s}.tile:hover img{opacity:.8}.status{font:20px Georgia,serif;margin:30px 3vw}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:100;display:none;align-items:center;justify-content:center}.lightbox.open{display:flex}.lightbox img{max-width:90vw;max-height:88vh;object-fit:contain}.lb-button{position:absolute;border:0;background:none;color:white;font:40px Impact,sans-serif;cursor:pointer;padding:15px}.lb-close{right:18px;top:10px}.lb-prev{left:15px;top:50%;transform:translateY(-50%)}.lb-next{right:15px;top:50%;transform:translateY(-50%)}.lb-count{position:absolute;bottom:20px;color:white;font:18px Impact,sans-serif}@media(max-width:600px){.gallery{columns:2 135px;column-gap:9px}.tile{margin-bottom:9px}.lightbox img{max-width:94vw;max-height:82vh}.lb-prev,.lb-next{font-size:30px;bottom:15px;top:auto;transform:none}}
</style></head><body><header class="header"><a href="index.html">LINNEA RM</a><a href="film-photo.html#photography">← FILM + PHOTO</a></header><h1 id="heading">PHOTOGRAPHY</h1><p class="sub" id="count">SELECTED IMAGES</p><nav class="categories" id="categories"></nav><main class="gallery" id="gallery"><p class="status">Loading photographs…</p></main><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photograph"><button class="lb-button lb-close" id="close" aria-label="Close">×</button><button class="lb-button lb-prev" id="prev" aria-label="Previous">←</button><img id="fullImage" alt="Enlarged photograph"><button class="lb-button lb-next" id="next" aria-label="Next">→</button><div class="lb-count" id="lbCount"></div></div>
<script>
const sections={portfolio:'PORTFOLIO',modeling:'MODELING',creative_direction:'CREATIVE DIRECTION',wildlife:'WILDLIFE'};
const params=new URLSearchParams(location.search);let section=params.get('section')||'portfolio';if(!sections[section])section='portfolio';
let photos=[],current=0;const gallery=document.getElementById('gallery'),lightbox=document.getElementById('lightbox'),fullImage=document.getElementById('fullImage');
document.getElementById('heading').textContent=sections[section];
for(const [key,label] of Object.entries(sections)){const a=document.createElement('a');a.href=`photo-gallery.html?section=${key}`;a.textContent=label;if(key===section)a.className='active';document.getElementById('categories').append(a)}
function showImage(i){if(!photos.length)return;current=(i+photos.length)%photos.length;fullImage.src=photos[current].url;fullImage.alt=`${sections[section]} photograph ${current+1}`;document.getElementById('lbCount').textContent=`${current+1} / ${photos.length}`;lightbox.classList.add('open');document.body.style.overflow='hidden';}
function closeImage(){lightbox.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').onclick=closeImage;document.getElementById('prev').onclick=()=>showImage(current-1);document.getElementById('next').onclick=()=>showImage(current+1);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeImage()});document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeImage();if(e.key==='ArrowRight')showImage(current+1);if(e.key==='ArrowLeft')showImage(current-1)});
let touchX=0;lightbox.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});lightbox.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX;if(dx>55)showImage(current-1);if(dx< -55)showImage(current+1)},{passive:true});
fetch(`https://api.github.com/repos/lrosemoe-coder/portfolio/contents/assets/photo/${section}?ref=main`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(files=>{photos=files.filter(f=>f.type==='file'&&/\.(jpe?g|png|webp|gif|avif)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(f=>({url:`./assets/photo/${section}/${encodeURIComponent(f.name)}`,name:f.name}));gallery.replaceChildren();document.getElementById('count').textContent=`${photos.length} PHOTOGRAPHS`;if(!photos.length)gallery.innerHTML='<p class="status">No photographs found.</p>';photos.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label',`Open photograph ${i+1}`);const img=document.createElement('img');img.src=p.url;img.alt=`${sections[section]} photograph ${i+1}`;img.loading='lazy';b.append(img);b.onclick=()=>showImage(i);gallery.append(b)});const requested=Number(params.get('image'));if(params.has('image')&&Number.isInteger(requested)&&requested>=0&&requested<photos.length)showImage(requested)}).catch(()=>gallery.innerHTML='<p class="status">Unable to load images from GitHub. Check the public folder or try again later.</p>');
</script></body></html>
