<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linnea RM</title>

  <style>

    /* =========================================
       BASIC PAGE SETUP
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #0757e8;
      color: white;
      overflow-x: hidden;
    }


    /* =========================================
       OUTER BORDER
       ========================================= */

    .page-border {
      position: fixed;

      top: 4px;
      left: 27px;
      right: 27px;
      bottom: 4px;

      border: 3px solid #8e48ff;

      pointer-events: none;
      z-index: 100;
    }

    .page-border::after {
      content: "";

      position: absolute;

      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;

      border: 2px solid white;
    }


    /* =========================================
       NAME
       ========================================= */

    .name {
      position: absolute;

      top: 18px;
      left: 50px;

      margin: 0;

      color: white;

      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 38px;
      font-weight: 500;

      letter-spacing: 2px;
      text-transform: uppercase;

      z-index: 10;
    }


    /* =========================================
       MAIN HOMEPAGE AREA
       ========================================= */

    .homepage {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 110px 65px 80px;
    }


    /* =========================================
       CATEGORY ROW
       ========================================= */

    .categories {
      width: 100%;
      max-width: 1550px;

      display: grid;

      grid-template-columns:
        1.1fr
        0.8fr
        1.15fr
        1fr
        0.95fr
        0.8fr;

      align-items: end;

      gap: 35px;
    }


    /* =========================================
       INDIVIDUAL CATEGORY
       ========================================= */

    .category {
      text-decoration: none;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      cursor: pointer;
    }


    /* IMAGE CONTAINER */

    .plant-container {
      width: 100%;
      height: 300px;

      display: flex;
      justify-content: center;
      align-items: flex-end;
    }


    /* PLANT IMAGES */

    .plant {
      display: block;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      transition:
        transform 0.4s cubic-bezier(.2,.8,.2,1),
        filter 0.4s ease;
    }


    /* =========================================
       INDIVIDUAL PLANT SIZES
       ========================================= */

    .data-science .plant {
      width: 260px;
    }

    .research .plant {
      width: 175px;
    }

    .film-photo .plant {
      width: 270px;
    }

    .product-design .plant {
      width: 210px;
    }

    .fashion .plant {
      width: 225px;
    }

    .art .plant {
      width: 185px;
    }


    /* =========================================
       LABELS
       ========================================= */

    .label {
      margin-top: 20px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: 400;

      white-space: nowrap;

      transition:
        transform 0.35s ease,
        opacity 0.35s ease;
    }


    /* =========================================
       HOVER EFFECT
       ========================================= */

    .category:hover .plant {
      transform: translateY(-12px) scale(1.07);
    }

    .category:hover .label {
      transform: translateY(-3px);
    }


    /* =========================================
       CLICK EFFECT
       ========================================= */

    .category:active .plant {
      transform: translateY(-6px) scale(1.03);
    }


    /* =========================================
       MOBILE / SMALLER SCREENS
       ========================================= */

    @media (max-width: 1000px) {

      .homepage {
        padding: 120px 60px 80px;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);
        gap: 70px 40px;
      }

      .plant-container {
        height: 260px;
      }

      .label {
        font-size: 25px;
      }

    }


    @media (max-width: 600px) {

      .page-border {
        left: 10px;
        right: 10px;
      }

      .name {
        left: 28px;
        top: 22px;
        font-size: 27px;
      }

      .homepage {
        padding: 110px 35px 70px;
      }

      .categories {
        grid-template-columns: 1fr;
        gap: 65px;
      }

      .plant-container {
        height: 270px;
      }

      .label {
        font-size: 26px;
      }

    }

  </style>
</head>


<body>

  <!-- DOUBLE BORDER -->

  <div class="page-border"></div>


  <!-- NAME -->

  <h1 class="name">LINNEA RM</h1>


  <!-- HOMEPAGE -->

  <main class="homepage">

    <div class="categories">


      <!-- DATA SCIENCE -->

      <a href="#" class="category data-science">

        <div class="plant-container">

          <img
            src="6(1).png"
            class="plant"
            alt="Data Science">

        </div>

        <div class="label">
          data science
        </div>

      </a>



      <!-- RESEARCH -->

      <a href="#" class="category research">

        <div class="plant-container">

          <img
            src="8(1).png"
            class="plant"
            alt="Research">

        </div>

        <div class="label">
          research
        </div>

      </a>



      <!-- FILM / PHOTO -->

      <a href="#" class="category film-photo">

        <div class="plant-container">

          <img
            src="9(1).png"
            class="plant"
            alt="Film and Photo">

        </div>

        <div class="label">
          film/photo
        </div>

      </a>



      <!-- PRODUCT DESIGN -->

      <a href="#" class="category product-design">

        <div class="plant-container">

          <img
            src="10(1).png"
            class="plant"
            alt="Product Design">

        </div>

        <div class="label">
          product design
        </div>

      </a>



      <!-- FASHION -->

      <a href="#" class="category fashion">

        <div class="plant-container">

          <img
            src="11(1).png"
            class="plant"
            alt="Fashion">

        </div>

        <div class="label">
          fashion
        </div>

      </a>



      <!-- ART -->

      <a href="#" class="category art">

        <div class="plant-container">

          <img
            src="7(1).png"
            class="plant"
            alt="Art">

        </div>

        <div class="label">
          art
        </div>

      </a>


    </div>

  </main>

</body>

</html>
