<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linnea RM</title>

  <style>

    /* =========================================
       PAGE
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #0757e8;
      color: white;
      overflow-x: hidden;
    }


    /* =========================================
       NAME
       ========================================= */

    .name {
      position: absolute;
      top: 20px;
      left: 45px;

      margin: 0;

      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 2px;

      color: white;
      text-transform: uppercase;

      z-index: 10;
    }


    /* =========================================
       HOMEPAGE
       ========================================= */

    .homepage {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 85px 3vw 45px;
    }


    /* =========================================
       SEAWEED ROW
       ========================================= */

    .categories {
      width: 100%;
      max-width: 1800px;

      display: grid;

      grid-template-columns:
        1.15fr
        0.8fr
        1.25fr
        0.95fr
        0.95fr
        0.8fr;

      align-items: end;

      column-gap: 1.5vw;
    }


    /* =========================================
       INDIVIDUAL CATEGORY
       ========================================= */

    .category {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      min-width: 0;

      color: white;
      text-decoration: none;

      cursor: pointer;
    }


    /* =========================================
       PLANT CONTAINER
       ========================================= */

    .plant-container {
      width: 100%;
      height: 62vh;

      display: flex;
      justify-content: center;
      align-items: flex-end;
    }


    /* =========================================
       PLANTS
       ========================================= */

    .plant {
      display: block;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      transform:
        translate(
          var(--x, 0px),
          var(--y, 0px)
        )
        scale(var(--scale, 1));

      transform-origin: bottom center;

      transition:
        transform 0.4s cubic-bezier(.2, .8, .2, 1);
    }


    /* =========================================
       INDIVIDUAL PLANT CONTROLS
       ========================================= */


    /* DATA SCIENCE */

    .data-science .plant {
      width: 100%;

      --scale: 1.08;
      --x: 0px;
      --y: 0px;
    }


    /* RESEARCH */

    .research .plant {
      width: 100%;

      --scale: 1.05;
      --x: 0px;
      --y: 0px;
    }


    /* FILM / PHOTO */

    .film-photo .plant {
      width: 100%;

      --scale: 1.12;
      --x: 0px;
      --y: 0px;
    }


    /* PRODUCT DESIGN */

    .product-design .plant {
      width: 100%;

      --scale: 1.07;
      --x: 0px;
      --y: 0px;
    }


    /* FASHION */

    .fashion .plant {
      width: 100%;

      --scale: 1.08;
      --x: 0px;
      --y: 0px;
    }


    /* ART */

    .art .plant {
      width: 100%;

      --scale: 1.05;
      --x: 0px;
      --y: 0px;
    }


    /* =========================================
       LABELS
       ========================================= */

    .label {
      width: 100%;

      margin-top: 24px;

      text-align: center;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(19px, 1.65vw, 31px);

      font-weight: 400;

      line-height: 1.1;

      color: white;

      white-space: nowrap;

      transition: transform 0.35s ease;
    }


    /* =========================================
       HOVER
       ========================================= */

    .category:hover .plant {
      transform:
        translate(
          var(--x, 0px),
          calc(var(--y, 0px) - 14px)
        )
        scale(calc(var(--scale, 1) * 1.05));
    }


    .category:hover .label {
      transform: translateY(-3px);
    }


    /* =========================================
       CLICK
       ========================================= */

    .category:active .plant {
      transform:
        translate(
          var(--x, 0px),
          calc(var(--y, 0px) - 6px)
        )
        scale(calc(var(--scale, 1) * 1.02));
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 1000px) {

      .homepage {
        padding: 110px 45px 70px;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);

        column-gap: 50px;
        row-gap: 80px;
      }

      .plant-container {
        height: 45vh;
        min-height: 300px;
      }

      .label {
        font-size: 26px;
      }

    }


    /* =========================================
       PHONE
       ========================================= */

    @media (max-width: 600px) {

      .name {
        top: 20px;
        left: 25px;

        font-size: 28px;
      }

      .homepage {
        padding: 100px 35px 60px;
      }

      .categories {
        grid-template-columns: 1fr;

        row-gap: 80px;
      }

      .plant-container {
        height: 55vh;
        min-height: 320px;
      }

      .label {
        font-size: 27px;
      }

    }

  </style>
</head>


<body>


  <!-- NAME -->

  <h1 class="name">
    LINNEA RM
  </h1>


  <!-- HOMEPAGE -->

  <main class="homepage">

    <div class="categories">


      <!-- DATA SCIENCE -->

      <a href="#" class="category data-science">

        <div class="plant-container">

          <img
            src="data-science.png"
            class="plant"
            alt="Data Science">

        </div>

        <div class="label">
          data science
        </div>

      </a>



      <!-- RESEARCH -->

      <a href="#" class="category research">

        <div class="plant-container">

          <img
            src="research.png"
            class="plant"
            alt="Research">

        </div>

        <div class="label">
          research
        </div>

      </a>



      <!-- FILM / PHOTO -->

      <a href="#" class="category film-photo">

        <div class="plant-container">

          <img
            src="film-photo.png"
            class="plant"
            alt="Film and Photo">

        </div>

        <div class="label">
          film/photo
        </div>

      </a>



      <!-- PRODUCT DESIGN -->

      <a href="#" class="category product-design">

        <div class="plant-container">

          <img
            src="product-design.png"
            class="plant"
            alt="Product Design">

        </div>

        <div class="label">
          product design
        </div>

      </a>



      <!-- FASHION -->

      <a href="#" class="category fashion">

        <div class="plant-container">

          <img
            src="fashion.png"
            class="plant"
            alt="Fashion">

        </div>

        <div class="label">
          fashion
        </div>

      </a>



      <!-- ART -->

      <a href="#" class="category art">

        <div class="plant-container">

          <img
            src="art.png"
            class="plant"
            alt="Art">

        </div>

        <div class="label">
          art
        </div>

      </a>


    </div>

  </main>


</body>

</html>
