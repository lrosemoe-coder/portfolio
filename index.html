<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linnea RM</title>

  <style>

    /* =========================
       PAGE SETUP
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #0757e8;
      color: white;
      overflow-x: hidden;
    }


    /* =========================
       NAME
       ========================= */

    .name {
      position: absolute;
      top: 20px;
      left: 45px;

      margin: 0;

      color: white;

      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 2px;

      text-transform: uppercase;

      z-index: 10;
    }


    /* =========================
       MAIN HOMEPAGE
       ========================= */

    .homepage {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 100px 55px 60px;
    }


    /* =========================
       SIX CATEGORIES
       ========================= */

    .categories {
      width: 100%;
      max-width: 1600px;

      display: grid;

      grid-template-columns:
        1.1fr
        0.8fr
        1.15fr
        1fr
        0.95fr
        0.8fr;

      align-items: end;

      gap: 35px;
    }


    /* =========================
       EACH CATEGORY
       ========================= */

    .category {
      color: white;
      text-decoration: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      cursor: pointer;
    }


    /* =========================
       IMAGE AREA
       ========================= */

    .plant-container {
      width: 100%;
      height: 300px;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .plant {
      display: block;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      transition: transform 0.4s cubic-bezier(.2, .8, .2, 1);
    }


 /* =========================
   INDIVIDUAL PLANT CONTROLS
   ========================= */

/* DATA SCIENCE */
.data-science .plant {
  width: 330px;
  --x: 0px;
  --y: 0px;
}

/* RESEARCH */
.research .plant {
  width: 350px;
  --x: 0px;
  --y: 0px;
}

/* FILM / PHOTO */
.film-photo .plant {
  width: 330px;
  --x: 0px;
  --y: 0px;
}

/* PRODUCT DESIGN */
.product-design .plant {
  width: 340px;
  --x: 0px;
  --y: 0px;
}

/* FASHION */
.fashion .plant {
  width: 340px;
  --x: 0px;
  --y: 0px;
}

/* ART */
.art .plant {
  width: 350px;
  --x: 0px;
  --y: 0px;
}

.plant {
  transform: translate(var(--x), var(--y));
}

  
    /* =========================
       CATEGORY LABELS
       ========================= */

    .label {
      margin-top: 20px;

      color: white;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: 400;

      white-space: nowrap;

      transition: transform 0.35s ease;
    }


    /* =========================
       HOVER EFFECT
       ========================= */

    .category:hover .plant {
      transform: translateY(-12px) scale(1.07);
    }

    .category:hover .label {
      transform: translateY(-3px);
    }


    /* =========================
       CLICK EFFECT
       ========================= */

    .category:active .plant {
      transform: translateY(-6px) scale(1.03);
    }


    /* =========================
       TABLET
       ========================= */

    @media (max-width: 1000px) {

      .categories {
        grid-template-columns: repeat(2, 1fr);
        gap: 70px 40px;
      }

      .plant-container {
        height: 260px;
      }

      .label {
        font-size: 25px;
      }

    }


    /* =========================
       PHONE
       ========================= */

    @media (max-width: 600px) {

      .name {
        top: 20px;
        left: 25px;
        font-size: 28px;
      }

      .homepage {
        padding: 100px 30px 60px;
      }

      .categories {
        grid-template-columns: 1fr;
        gap: 65px;
      }

      .plant-container {
        height: 270px;
      }

      .label {
        font-size: 26px;
      }

    }

  </style>
</head>


<body>


  <!-- NAME -->

  <h1 class="name">LINNEA RM</h1>


  <!-- MAIN HOMEPAGE -->

  <main class="homepage">

    <div class="categories">


      <!-- DATA SCIENCE -->

      <a href="#" class="category data-science">

        <div class="plant-container">
          <img
            src="6.png"
            class="plant"
            alt="Data Science">
        </div>

        <div class="label">
          data science
        </div>

      </a>


      <!-- RESEARCH -->

      <a href="#" class="category research">

        <div class="plant-container">
          <img
            src="8.png"
            class="plant"
            alt="Research">
        </div>

        <div class="label">
          research
        </div>

      </a>


      <!-- FILM / PHOTO -->

      <a href="#" class="category film-photo">

        <div class="plant-container">
          <img
            src="9.png"
            class="plant"
            alt="Film and Photo">
        </div>

        <div class="label">
          film/photo
        </div>

      </a>


      <!-- PRODUCT DESIGN -->

      <a href="#" class="category product-design">

        <div class="plant-container">
          <img
            src="10.png"
            class="plant"
            alt="Product Design">
        </div>

        <div class="label">
          product design
        </div>

      </a>


      <!-- FASHION -->

      <a href="#" class="category fashion">

        <div class="plant-container">
          <img
            src="11.png"
            class="plant"
            alt="Fashion">
        </div>

        <div class="label">
          fashion
        </div>

      </a>


      <!-- ART -->

      <a href="#" class="category art">

        <div class="plant-container">
          <img
            src="7.png"
            class="plant"
            alt="Art">
        </div>

        <div class="label">
          art
        </div>

      </a>


    </div>

  </main>

</body>

</html>
