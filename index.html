<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Linnea RM</title>


  <style>

    /* =========================================
       PAGE SETUP
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #0757e8;
      color: white;

      overflow-x: hidden;
    }



    /* =========================================
       NAME
       ========================================= */

    .name {
      position: absolute;

      top: 20px;
      left: 45px;

      margin: 0;

      font-family:
        Impact,
        "Arial Narrow",
        sans-serif;

      font-size: 38px;
      font-weight: 500;

      letter-spacing: 2px;

      color: white;

      text-transform: uppercase;

      z-index: 10;
    }



    /* =========================================
       MAIN HOMEPAGE
       ========================================= */

    .homepage {
      width: 100%;
      height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px 3vw 70px;

      /*
        MASTER VERTICAL CONTROL

        More negative = higher
        Less negative = lower
      */

      transform: translateY(-65px);
    }



    /* =========================================
       SEAWEED ROW
       ========================================= */

    .categories {
      width: 100%;
      max-width: 1800px;

      display: grid;

      grid-template-columns:
        1.15fr
        0.8fr
        1.25fr
        0.95fr
        0.95fr
        0.8fr;

      align-items: end;

      column-gap: 1.5vw;
    }



    /* =========================================
       INDIVIDUAL CATEGORY
       ========================================= */

    .category {
      width: 100%;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      min-width: 0;

      /*
        IMPORTANT:

        The big category column itself
        cannot trigger hover.
      */

      pointer-events: none;
    }



    /* =========================================
       HOVER GROUP

       This contains BOTH:
       - seaweed
       - label

       This is the ONLY interactive area.
       ========================================= */

    .hover-group {
      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: flex-end;

      pointer-events: auto;

      cursor: pointer;

      text-decoration: none;
      color: white;

      transform:
        translate(
          var(--x, 0px),
          var(--y, 0px)
        );

      transition:
        transform
        0.45s
        cubic-bezier(.2, .8, .2, 1);
    }



    /* =========================================
       PLANT AREA
       ========================================= */

    .plant-area {
      width: 100%;
      height: 62vh;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      /*
        The blank positioning area itself
        ignores the mouse.
      */

      pointer-events: none;
    }



    /* =========================================
       IMAGE WRAPPER
       ========================================= */

    .plant-wrap {
      width: 100%;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      pointer-events: auto;

      transform:
        scale(
          var(--scale, 1)
        );

      transform-origin:
        bottom center;
    }



    /* =========================================
       IMAGE
       ========================================= */

    .plant {
      display: block;

      width: 100%;
      height: auto;

      max-height: 62vh;

      object-fit: contain;

      transform-origin:
        bottom center;
    }



    /* =========================================
       INDIVIDUAL CONTROLS
       ========================================= */


    /* DATA ANALYTICS */

    .data-science {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: -2deg;
    }



    /* RESEARCH */

    .research {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: 1.5deg;
    }



    /* FILM / PHOTO */

    .film-photo {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: -1.5deg;
    }



    /* PRODUCT DESIGN */

    .product-design {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: 1.5deg;
    }



    /* FASHION */

    .fashion {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: -1.5deg;
    }



    /* ART */

    .art {

      --scale: .88;

      --x: 0px;
      --y: 0px;

      --tilt: 2deg;
    }



    /* =========================================
       LABEL
       ========================================= */

    .label {
      width: 100%;

      margin-top: 24px;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          19px,
          1.65vw,
          31px
        );

      font-weight: 400;

      line-height: 1.1;

      color: white;

      white-space: nowrap;

      pointer-events: auto;
    }



    /* =========================================
       HOVER

       Moves the SEAWEED + TEXT together
       ========================================= */

    .hover-group:hover {

      transform:
        translate(
          var(--x, 0px),
          calc(var(--y, 0px) - 22px)
        )
        scale(1.05)
        rotate(
          var(--tilt, 0deg)
        );
    }



    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 1000px) {

      .homepage {

        height: auto;
        min-height: 100vh;

        padding:
          110px
          45px
          70px;

        transform: none;
      }


      .categories {

        grid-template-columns:
          repeat(2, 1fr);

        column-gap: 50px;
        row-gap: 80px;
      }


      .plant-area {

        height: 45vh;

        min-height: 300px;
      }


      .plant {

        max-height: 45vh;
      }


      .label {

        font-size: 26px;
      }

    }



    /* =========================================
       PHONE
       ========================================= */

    @media (max-width: 600px) {

      .name {

        top: 20px;
        left: 25px;

        font-size: 28px;
      }


      .homepage {

        height: auto;

        padding:
          100px
          35px
          60px;

        transform: none;
      }


      .categories {

        grid-template-columns: 1fr;

        row-gap: 80px;
      }


      .plant-area {

        height: 55vh;

        min-height: 320px;
      }


      .plant {

        max-height: 55vh;
      }


      .label {

        font-size: 27px;
      }

    }


  </style>

</head>



<body>


  <!-- NAME -->

  <h1 class="name">
    LINNEA RM
  </h1>



  <!-- HOMEPAGE -->

  <main class="homepage">


    <div class="categories">



      <!-- DATA ANALYTICS -->

      <div class="category data-science">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="data-science.png"
                class="plant"
                alt="Data Analytics"
              >

            </div>

          </div>

          <div class="label">
            data analytics
          </div>

        </div>

      </div>



      <!-- RESEARCH -->

      <div class="category research">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="research.png"
                class="plant"
                alt="Research"
              >

            </div>

          </div>

          <div class="label">
            research
          </div>

        </div>

      </div>



      <!-- FILM / PHOTO -->

      <div class="category film-photo">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="film-photo.png"
                class="plant"
                alt="Film and Photo"
              >

            </div>

          </div>

          <div class="label">
            film/photo
          </div>

        </div>

      </div>



      <!-- PRODUCT DESIGN -->

      <div class="category product-design">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="product-design.png"
                class="plant"
                alt="Product Design"
              >

            </div>

          </div>

          <div class="label">
            product design
          </div>

        </div>

      </div>



      <!-- FASHION -->

      <div class="category fashion">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="fashion.png"
                class="plant"
                alt="Fashion"
              >

            </div>

          </div>

          <div class="label">
            fashion
          </div>

        </div>

      </div>



      <!-- ART -->

      <div class="category art">

        <div class="hover-group">

          <div class="plant-area">

            <div class="plant-wrap">

              <img
                src="art.png"
                class="plant"
                alt="Art"
              >

            </div>

          </div>

          <div class="label">
            art
          </div>

        </div>

      </div>


    </div>


  </main>


</body>

</html>
