<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linnea RM</title>

  <style>

    /* ==================================================
       BASIC PAGE SETUP
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;
    }

    body {
      background: #0757e8;
      color: white;

      overflow-x: hidden;
    }



    /* ==================================================
       NAME
       ================================================== */

    .name {
      position: absolute;

      top: 20px;
      left: 45px;

      margin: 0;

      font-family: Impact, "Arial Narrow", sans-serif;

      font-size: 38px;
      font-weight: 500;

      letter-spacing: 2px;

      color: white;

      z-index: 10;
    }



    /* ==================================================
       HOMEPAGE
       
       No transforms.
       No JavaScript.
       No weird positioning tricks.
       ================================================== */

    .homepage {
      width: 100%;
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      /*
        More bottom padding pushes the
        whole collection upward.
      */

      padding:
        20px
        3vw
        150px;
    }



    /* ==================================================
       SIX COLUMN LAYOUT
       ================================================== */

    .categories {
      width: 100%;
      max-width: 1800px;

      display: grid;

      grid-template-columns:
        1.15fr
        0.8fr
        1.25fr
        0.95fr
        0.95fr
        0.8fr;

      align-items: end;

      gap: 1.5vw;
    }



    /* ==================================================
       CATEGORY POSITIONING COLUMN

       This creates the vertical space we need.

       IMPORTANT:
       This is NOT the hover target.
       ================================================== */

    .category {
      height: 62vh;

      display: flex;

      align-items: flex-end;
      justify-content: center;

      min-width: 0;
    }



    /* ==================================================
       INTERACTIVE CARD

       THIS is the hover target.

       Very important:
       THIS CARD NEVER MOVES.

       Therefore the mouse cannot accidentally
       leave/re-enter the hover target while
       the animation is happening.
       ================================================== */

    .card {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: flex-end;

      cursor: pointer;

      color: white;
      text-decoration: none;
    }



    /* ==================================================
       IMAGE
       ================================================== */

    .plant {
      display: block;

      width: 100%;
      height: auto;

      max-width: 100%;
      max-height: 54vh;

      object-fit: contain;

      transform-origin: bottom center;

      transition:
        transform
        0.5s
        cubic-bezier(.2, .8, .2, 1);
    }



    /* ==================================================
       LABEL
       ================================================== */

    .label {
      margin-top: 24px;

      width: 100%;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          19px,
          1.65vw,
          31px
        );

      font-weight: 400;

      line-height: 1.1;

      white-space: nowrap;

      color: white;

      transition:
        transform
        0.5s
        cubic-bezier(.2, .8, .2, 1);
    }



    /* ==================================================
       INDIVIDUAL SEAWEED SIZES + TILTS
       ================================================== */

    .data-science {
      --plant-size: 1.03;
      --tilt: -2deg;
    }

    .research {
      --plant-size: 1.00;
      --tilt: 1.5deg;
    }

    .film-photo {
      --plant-size: 1.07;
      --tilt: -1.5deg;
    }

    .product-design {
      --plant-size: 1.02;
      --tilt: 1.5deg;
    }

    .fashion {
      --plant-size: 1.03;
      --tilt: -1.5deg;
    }

    .art {
      --plant-size: 1.00;
      --tilt: 2deg;
    }



    /* ==================================================
       NORMAL PLANT SIZE
       ================================================== */

    .category .plant {
      transform:
        scale(
          var(--plant-size, 1)
        );
    }



    /* ==================================================
       HOVER

       Hovering anywhere on the card triggers BOTH.

       But they move differently.

       Plant:
       - moves up 22px
       - grows
       - tilts

       Text:
       - only moves up 7px

       THE CARD ITSELF DOES NOT MOVE.
       ================================================== */

    .card:hover .plant {
      transform:
        translateY(-22px)
        scale(
          calc(var(--plant-size, 1) * 1.08)
        )
        rotate(
          var(--tilt, 0deg)
        );
    }


    .card:hover .label {
      transform:
        translateY(-7px);
    }



    /* ==================================================
       TABLET
       ================================================== */

    @media (max-width: 1000px) {

      .homepage {
        padding:
          110px
          45px
          70px;
      }


      .categories {
        grid-template-columns:
          repeat(2, 1fr);

        column-gap: 50px;
        row-gap: 80px;
      }


      .category {
        height: auto;
      }


      .plant {
        max-height: 42vh;
      }


      .label {
        font-size: 26px;
      }

    }



    /* ==================================================
       PHONE
       ================================================== */

    @media (max-width: 600px) {

      .name {
        top: 20px;
        left: 25px;

        font-size: 28px;
      }


      .homepage {
        padding:
          100px
          35px
          60px;
      }


      .categories {
        grid-template-columns: 1fr;

        row-gap: 80px;
      }


      .category {
        height: auto;
      }


      .plant {
        max-height: 50vh;
      }


      .label {
        font-size: 27px;
      }

    }


  </style>

</head>


<body>


  <!-- ==================================================
       NAME
       ================================================== -->

  <h1 class="name">
    LINNEA RM
  </h1>



  <!-- ==================================================
       HOMEPAGE
       ================================================== -->

  <main class="homepage">


    <div class="categories">



      <!-- DATA ANALYTICS -->

      <div class="category data-science">

        <div class="card">

          <img
            src="data-science.png"
            class="plant"
            alt="Data Analytics"
          >

          <div class="label">
            data analytics
          </div>

        </div>

      </div>



      <!-- RESEARCH -->

      <div class="category research">

        <div class="card">

          <img
            src="research.png"
            class="plant"
            alt="Research"
          >

          <div class="label">
            research
          </div>

        </div>

      </div>



      <!-- FILM / PHOTO -->

      <div class="category film-photo">

        <div class="card">

          <img
            src="film-photo.png"
            class="plant"
            alt="Film and Photo"
          >

          <div class="label">
            film/photo
          </div>

        </div>

      </div>



      <!-- PRODUCT DESIGN -->

      <div class="category product-design">

        <div class="card">

          <img
            src="product-design.png"
            class="plant"
            alt="Product Design"
          >

          <div class="label">
            product design
          </div>

        </div>

      </div>



      <!-- FASHION -->

      <div class="category fashion">

        <div class="card">

          <img
            src="fashion.png"
            class="plant"
            alt="Fashion"
          >

          <div class="label">
            fashion
          </div>

        </div>

      </div>



      <!-- ART -->

      <div class="category art">

        <div class="card">

          <img
            src="art.png"
            class="plant"
            alt="Art"
          >

          <div class="label">
            art
          </div>

        </div>

      </div>


    </div>


  </main>


</body>

</html>
