<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linnea RM</title>

  <style>

    /* =========================================
       PAGE SETUP
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #0757e8;
      color: white;
      overflow-x: hidden;
    }


    /* =========================================
       NAME
       ========================================= */

    .name {
      position: absolute;
      top: 18px;
      left: 48px;

      margin: 0;

      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 2px;

      color: white;
      text-transform: uppercase;

      z-index: 10;
    }


    /* =========================================
       HOMEPAGE
       ========================================= */

    .homepage {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 90px 4vw 50px;
    }


    /* =========================================
       CATEGORY ROW
       ========================================= */

    .categories {
      width: 100%;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 2vw;
    }


    /* =========================================
       INDIVIDUAL CATEGORY
       ========================================= */

    .category {
      color: white;
      text-decoration: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      flex: 1;

      cursor: pointer;
    }


    /* =========================================
       PLANT AREA
       ========================================= */

    .plant-container {
      width: 100%;
      height: 390px;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }


    .plant {
      display: block;

      object-fit: contain;

      transform: translate(var(--x, 0px), var(--y, 0px));

      transition:
        transform 0.4s cubic-bezier(.2, .8, .2, 1),
        filter 0.4s ease;
    }


    /* =========================================
       INDIVIDUAL PLANTS
       ========================================= */


    /* DATA SCIENCE */

    .data-science .plant {
      width: 310px;

      --x: 0px;
      --y: 0px;
    }


    /* RESEARCH */

    .research .plant {
      width: 245px;

      --x: 0px;
      --y: 0px;
    }


    /* FILM / PHOTO */

    .film-photo .plant {
      width: 330px;

      --x: 0px;
      --y: 0px;
    }


    /* PRODUCT DESIGN */

    .product-design .plant {
      width: 280px;

      --x: 0px;
      --y: 0px;
    }


    /* FASHION */

    .fashion .plant {
      width: 285px;

      --x: 0px;
      --y: 0px;
    }


    /* ART */

    .art .plant {
      width: 255px;

      --x: 0px;
      --y: 0px;
    }


    /* =========================================
       LABELS
       ========================================= */

    .label {
      width: 100%;

      margin-top: 20px;

      text-align: center;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 1.8vw, 32px);
      font-weight: 400;

      white-space: nowrap;

      transition: transform 0.35s ease;
    }


    /* =========================================
       HOVER
       ========================================= */

    .category:hover .plant {
      transform:
        translate(
          var(--x, 0px),
          calc(var(--y, 0px) - 15px)
        )
        scale(1.06);
    }

    .category:hover .label {
      transform: translateY(-4px);
    }


    /* =========================================
       CLICK
       ========================================= */

    .category:active .plant {
      transform:
        translate(
          var(--x, 0px),
          calc(var(--y, 0px) - 7px)
        )
        scale(1.03);
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 1000px) {

      .homepage {
        padding: 120px 50px 70px;
      }

      .categories {
        display: grid;
        grid-template-columns: repeat(2, 1fr);

        gap: 70px 40px;
      }

      .plant-container {
        height: 320px;
      }

      .plant {
        max-width: 90%;
        max-height: 100%;
      }

    }


    /* =========================================
       PHONE
       ========================================= */

    @media (max-width: 600px) {

      .name {
        top: 20px;
        left: 25px;

        font-size: 28px;
      }

      .homepage {
        padding: 100px 30px 60px;
      }

      .categories {
        grid-template-columns: 1fr;

        gap: 70px;
      }

      .plant-container {
        height: 300px;
      }

      .plant {
        max-width: 90%;
        max-height: 100%;
      }

      .label {
        font-size: 27px;
      }

    }

  </style>
</head>


<body>


  <h1 class="name">LINNEA RM</h1>


  <main class="homepage">

    <div class="categories">


      <!-- DATA SCIENCE -->

      <a href="#" class="category data-science">

        <div class="plant-container">
          <img src="6.png" class="plant" alt="Data Science">
        </div>

        <div class="label">
          data science
        </div>

      </a>



      <!-- RESEARCH -->

      <a href="#" class="category research">

        <div class="plant-container">
          <img src="8.png" class="plant" alt="Research">
        </div>

        <div class="label">
          research
        </div>

      </a>



      <!-- FILM / PHOTO -->

      <a href="#" class="category film-photo">

        <div class="plant-container">
          <img src="9.png" class="plant" alt="Film and Photo">
        </div>

        <div class="label">
          film/photo
        </div>

      </a>



      <!-- PRODUCT DESIGN -->

      <a href="#" class="category product-design">

        <div class="plant-container">
          <img src="10.png" class="plant" alt="Product Design">
        </div>

        <div class="label">
          product design
        </div>

      </a>



      <!-- FASHION -->

      <a href="#" class="category fashion">

        <div class="plant-container">
          <img src="11.png" class="plant" alt="Fashion">
        </div>

        <div class="label">
          fashion
        </div>

      </a>



      <!-- ART -->

      <a href="#" class="category art">

        <div class="plant-container">
          <img src="7.png" class="plant" alt="Art">
        </div>

        <div class="label">
          art
        </div>

      </a>


    </div>

  </main>


</body>

</html>
