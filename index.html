<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Linnea Moe</title>


  <style>

    /* =========================================
       RESET
       ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #e7e7e7;
    }

    body {
      overflow-x: hidden;
    }



    /* =========================================
       SITE
       ========================================= */

    .site {
      width: 100%;
      min-height: 100vh;

      background: #e7e7e7;
    }



    /* =========================================
       TOP NAVIGATION
       ========================================= */

    .top-nav {
      width: 100%;
      height: 76px;

      display: grid;

      grid-template-columns:
        1.15fr
        0.8fr
        1.25fr
        0.95fr
        0.95fr
        0.8fr;

      align-items: center;

      column-gap: 1.5vw;

      padding:
        0
        22px;

      background: #e7e7e7;
    }



    .nav-link {
      color: #0757e8;

      text-decoration: none;

      font-family:
        Impact,
        "Arial Narrow",
        sans-serif;

      font-size:
        clamp(
          17px,
          1.65vw,
          29px
        );

      font-weight: 500;

      letter-spacing: 1px;

      line-height: 1;

      white-space: nowrap;

      text-align: center;

      transition:
        opacity 0.25s ease;
    }



    .nav-link:hover {
      opacity: 0.55;
    }



    /* =========================================
       HERO
       ========================================= */

    .hero {
      position: relative;

      width: 100%;

      /*
        Explicit height makes sure the
        image always has space to display.
      */

      height:
        calc(
          100vh - 138px
        );

      min-height: 500px;

      overflow: hidden;

      background: #071a18;
    }



    /* =========================================
       HERO IMAGE
       ========================================= */

    .hero-image {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      /*
        COVER = fill the entire hero.

        The image may crop slightly depending
        on the browser dimensions, but there
        will be no empty space.
      */

      object-fit: cover;

      object-position: center;

      display: block;

      z-index: 1;

      user-select: none;

      pointer-events: none;
    }



    /* =========================================
       SUBTLE IMAGE OVERLAY
       ========================================= */

    .image-overlay {
      position: absolute;

      inset: 0;

      background:
        rgba(
          0,
          0,
          0,
          0.035
        );

      pointer-events: none;

      z-index: 2;
    }



    /* =========================================
       TITLE
       ========================================= */

    .hero-title {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(
          -50%,
          -50%
        );

      width: 100%;

      display: flex;

      justify-content: center;
      align-items: center;

      white-space: nowrap;

      pointer-events: none;

      z-index: 3;
    }



    /* =========================================
       INDIVIDUAL TITLE LETTERS
       ========================================= */

    .hero-letter {
      position: relative;

      display: inline-block;

      font-family:
        Impact,
        "Arial Narrow",
        sans-serif;

      font-size:
        clamp(
          90px,
          16vw,
          310px
        );

      font-weight: 500;

      line-height: 0.78;

      letter-spacing:
        -0.035em;

      color: #e7e7e7;

      text-transform: uppercase;

      transform-origin: center;

      transform:
        translateX(
          var(--letter-x, 0px)
        )

        translateY(
          var(--letter-y, 0px)
        )

        scaleX(
          var(--letter-scale-x, 1)
        )

        scaleY(
          var(--letter-scale-y, 1)
        );

      will-change: transform;
    }



    /* =========================================
       SPACE BETWEEN LINNEA + MOE
       ========================================= */

    .hero-space {
      display: inline-block;

      width:
        clamp(
          24px,
          3.5vw,
          70px
        );

      flex-shrink: 0;
    }



    /* =========================================
       BOTTOM BAR
       ========================================= */

    .bottom-bar {
      width: 100%;
      height: 62px;

      display: flex;

      align-items: center;

      justify-content: flex-end;

      padding:
        0
        22px;

      background: #e7e7e7;
    }



    /* =========================================
       CONTACT
       ========================================= */

    .contact {
      font-family:
        Impact,
        "Arial Narrow",
        sans-serif;

      font-size:
        clamp(
          18px,
          1.65vw,
          29px
        );

      font-weight: 500;

      letter-spacing: 1px;

      line-height: 1;

      color: #0757e8;

      text-decoration: none;

      text-transform: uppercase;

      transition:
        opacity 0.25s ease;
    }



    .contact:hover {
      opacity: 0.55;
    }



    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 1000px) {

      .top-nav {
        height: auto;

        grid-template-columns:
          repeat(3, 1fr);

        row-gap: 18px;

        padding:
          18px
          14px;
      }


      .nav-link {
        font-size: 22px;
      }


      .hero {
        height: 72vh;

        min-height: 520px;
      }


      .hero-letter {
        font-size:
          clamp(
            70px,
            15vw,
            170px
          );
      }


      .bottom-bar {
        height: 60px;

        padding:
          0
          18px;
      }

    }



    /* =========================================
       PHONE
       ========================================= */

    @media (max-width: 600px) {

      .top-nav {
        grid-template-columns:
          repeat(2, 1fr);

        column-gap: 10px;
        row-gap: 14px;

        padding:
          16px
          8px;
      }


      .nav-link {
        font-size: 19px;
      }


      .hero {
        height: 70vh;

        min-height: 500px;
      }


      .hero-title {
        transform:
          translate(
            -50%,
            -50%
          )
          scale(0.92);
      }


      .hero-letter {
        font-size:
          clamp(
            55px,
            16vw,
            95px
          );
      }


      .hero-space {
        width: 14px;
      }


      .bottom-bar {
        height: 55px;

        padding:
          0
          12px;
      }


      .contact {
        font-size: 20px;
      }

    }



    /* =========================================
       REDUCED MOTION
       ========================================= */

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      .hero-letter {
        transform: none !important;
      }

    }


  </style>

</head>



<body>


  <div class="site">



    <!-- =======================================
         TOP NAVIGATION
         ======================================= -->

    <nav class="top-nav">


      <a
        href="data-analytics.html"
        class="nav-link"
      >
        data analytics
      </a>


      <a
        href="research.html"
        class="nav-link"
      >
        research
      </a>


      <a
        href="film-photo.html"
        class="nav-link"
      >
        film & photo
      </a>


      <a
        href="product-design.html"
        class="nav-link"
      >
        product design
      </a>


      <a
        href="fashion.html"
        class="nav-link"
      >
        fashion
      </a>


      <a
        href="art.html"
        class="nav-link"
      >
        art
      </a>


    </nav>



    <!-- =======================================
         HERO
         ======================================= -->

    <main class="hero">


      <!-- =====================================
           IMAGE
           ===================================== -->

      <img
        src="./home-image.jpg"
        class="hero-image"
        alt="Linnea Moe portfolio"
      >



      <!-- =====================================
           SUBTLE OVERLAY
           ===================================== -->

      <div class="image-overlay"></div>



      <!-- =====================================
           INTERACTIVE TITLE
           ===================================== -->

      <div
        class="hero-title"
        aria-label="Linnea Moe"
      >


        <span class="hero-letter">
          L
        </span>


        <span class="hero-letter">
          I
        </span>


        <span class="hero-letter">
          N
        </span>


        <span class="hero-letter">
          N
        </span>


        <span class="hero-letter">
          E
        </span>


        <span class="hero-letter">
          A
        </span>



        <span class="hero-space"></span>



        <span class="hero-letter">
          M
        </span>


        <span class="hero-letter">
          O
        </span>


        <span class="hero-letter">
          E
        </span>


      </div>


    </main>



    <!-- =======================================
         BOTTOM
         ======================================= -->

    <footer class="bottom-bar">


      <a
        class="contact"
        href="mailto:YOUR-EMAIL-HERE"
      >
        CONTACT
      </a>


    </footer>


  </div>



  <script>

    /* =========================================
       GEOMETRIC TITLE EXPANSION
       ========================================= */


    const hero =
      document.querySelector(
        ".hero"
      );


    const letters =
      Array.from(
        document.querySelectorAll(
          ".hero-letter"
        )
      );



    /* =========================================
       LETTER STATES
       ========================================= */

    const letterStates =
      letters.map(
        (letter) => {

          return {

            element:
              letter,

            x:
              0,

            y:
              0,

            scaleX:
              1,

            scaleY:
              1,

            targetX:
              0,

            targetY:
              0,

            targetScaleX:
              1,

            targetScaleY:
              1

          };

        }
      );



    /* =========================================
       MOUSE
       ========================================= */

    let mouseX =
      window.innerWidth / 2;


    let mouseY =
      window.innerHeight / 2;



    hero.addEventListener(

      "mousemove",

      (event) => {


        mouseX =
          event.clientX;


        mouseY =
          event.clientY;


        updateTargets();

      }

    );



    hero.addEventListener(

      "mouseleave",

      () => {

        resetTargets();

      }

    );



    /* =========================================
       CALCULATE GEOMETRIC EXPANSION
       ========================================= */

    function updateTargets() {


      letterStates.forEach(
        (state) => {


          const rect =
            state.element
              .getBoundingClientRect();


          const centerX =
            rect.left +
            rect.width / 2;


          const centerY =
            rect.top +
            rect.height / 2;



          const dx =
            centerX -
            mouseX;


          const dy =
            centerY -
            mouseY;



          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );



          /* ===================================
             INTERACTION RADIUS
             =================================== */

          const radius =
            420;



          let influence =
            1 -
            distance /
            radius;



          influence =
            Math.max(
              0,
              Math.min(
                1,
                influence
              )
            );



          /* ===================================
             SMOOTH FALLOFF
             =================================== */

          influence =
            influence *
            influence *
            (
              3 -
              2 * influence
            );



          /* ===================================
             DIRECTION
             =================================== */

          const safeDistance =
            Math.max(
              distance,
              1
            );


          const directionX =
            dx /
            safeDistance;


          const directionY =
            dy /
            safeDistance;



          /* ===================================
             HORIZONTAL EXPANSION
             =================================== */

          state.targetScaleX =
            1 +
            influence *
            0.42;



          /* ===================================
             SLIGHT VERTICAL COMPRESSION
             =================================== */

          state.targetScaleY =
            1 -
            influence *
            0.07;



          /* ===================================
             PUSH LETTERS AWAY
             =================================== */

          state.targetX =
            directionX *
            influence *
            90;


          state.targetY =
            directionY *
            influence *
            8;


        }
      );

    }



    /* =========================================
       RESET TITLE
       ========================================= */

    function resetTargets() {


      letterStates.forEach(
        (state) => {


          state.targetX =
            0;


          state.targetY =
            0;


          state.targetScaleX =
            1;


          state.targetScaleY =
            1;


        }
      );

    }



    /* =========================================
       ANIMATION LOOP
       ========================================= */

    function animate() {


      letterStates.forEach(
        (state) => {


          /*
            Lower = smoother/slower
            Higher = quicker
          */

          const smoothing =
            0.095;



          state.x +=
            (
              state.targetX -
              state.x
            )
            *
            smoothing;



          state.y +=
            (
              state.targetY -
              state.y
            )
            *
            smoothing;



          state.scaleX +=
            (
              state.targetScaleX -
              state.scaleX
            )
            *
            smoothing;



          state.scaleY +=
            (
              state.targetScaleY -
              state.scaleY
            )
            *
            smoothing;



          /* ===================================
             SEND VALUES TO CSS
             =================================== */

          state.element.style
            .setProperty(

              "--letter-x",

              state.x +
              "px"

            );



          state.element.style
            .setProperty(

              "--letter-y",

              state.y +
              "px"

            );



          state.element.style
            .setProperty(

              "--letter-scale-x",

              state.scaleX

            );



          state.element.style
            .setProperty(

              "--letter-scale-y",

              state.scaleY

            );


        }
      );



      requestAnimationFrame(
        animate
      );

    }



    animate();


  </script>


</body>

</html>
